<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="540" rx="20" fill="#fafbff"/>

  <!-- ===== Top section: relay fan-out ===== -->

  <!-- Agent / MCP client -->
  <rect x="20" y="145" width="180" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="110" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">MCPクライアント</text>
  <text x="110" y="212" text-anchor="middle" font-size="11.5" fill="#64748b">(Agent / Dify など)</text>

  <!-- Octopus MCP Proxy hub -->
  <rect x="390" y="110" width="240" height="180" rx="18" fill="url(#accelGradient)"/>
  <text x="510" y="183" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">Octopus MCP Proxy</text>
  <text x="510" y="208" text-anchor="middle" font-size="13" fill="#eef0ff">中継・権限管理</text>
  <text x="510" y="226" text-anchor="middle" font-size="13" fill="#eef0ff">Web管理画面</text>
  <text x="510" y="248" text-anchor="middle" font-size="10.5" fill="#dcdcff">(Relay / Permissions / Admin UI)</text>

  <!-- API Server -->
  <rect x="800" y="20" width="200" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="900" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">API サーバー</text>
  <text x="900" y="78" text-anchor="middle" font-size="11.5" fill="#64748b">(API Server)</text>

  <!-- MCP Server -->
  <rect x="800" y="290" width="200" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="900" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">MCP サーバー</text>
  <text x="900" y="348" text-anchor="middle" font-size="11.5" fill="#64748b">(MCP Server)</text>

  <!-- Arrows: top section -->
  <line x1="200" y1="200" x2="386" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="225" y="172" width="135" height="20" rx="4" fill="#fafbff"/>
  <text x="292" y="186" text-anchor="middle" font-size="11.5" fill="#475569">MCP / Streamable HTTP</text>

  <line x1="630" y1="155" x2="796" y2="70" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="667" y="95" width="78" height="20" rx="4" fill="#fafbff"/>
  <text x="706" y="109" text-anchor="middle" font-size="12" fill="#475569">API中継</text>

  <line x1="630" y1="245" x2="796" y2="330" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="667" y="295" width="78" height="20" rx="4" fill="#fafbff"/>
  <text x="706" y="309" text-anchor="middle" font-size="12" fill="#475569">MCP中継</text>

  <!-- ===== Divider ===== -->
  <rect x="20" y="392" width="1000" height="1.5" fill="#e2e8f0"/>
  <text x="520" y="416" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">連結（デイジーチェーン）の例 — daisy-chaining multiple Octopus MCP Proxy instances</text>

  <!-- ===== Bottom section: daisy chain ===== -->

  <rect x="40" y="430" width="150" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="115" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Agent</text>
  <text x="115" y="484" text-anchor="middle" font-size="10.5" fill="#64748b">(MCP Client)</text>

  <rect x="260" y="430" width="200" height="80" rx="14" fill="url(#accelGradient)"/>
  <text x="360" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Octopus MCP Proxy</text>
  <text x="360" y="484" text-anchor="middle" font-size="10.5" fill="#eef0ff">(1台目)</text>

  <rect x="540" y="430" width="200" height="80" rx="14" fill="url(#accelGradient)"/>
  <text x="640" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Octopus MCP Proxy</text>
  <text x="640" y="484" text-anchor="middle" font-size="10.5" fill="#eef0ff">(2台目)</text>

  <rect x="820" y="430" width="200" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="920" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">MCP サーバー</text>
  <text x="920" y="484" text-anchor="middle" font-size="10.5" fill="#64748b">(MCP Server)</text>

  <!-- Arrows: bottom section -->
  <line x1="190" y1="470" x2="256" y2="470" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="193" y="448" width="60" height="18" rx="4" fill="#fafbff"/>
  <text x="223" y="461" text-anchor="middle" font-size="11" fill="#475569">MCP</text>

  <line x1="460" y1="470" x2="536" y2="470" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="458" y="448" width="80" height="18" rx="4" fill="#fafbff"/>
  <text x="498" y="461" text-anchor="middle" font-size="11" fill="#475569">連結 / chain</text>

  <line x1="740" y1="470" x2="816" y2="470" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="735" y="448" width="80" height="18" rx="4" fill="#fafbff"/>
  <text x="775" y="461" text-anchor="middle" font-size="11" fill="#475569">MCP中継</text>
</svg>
