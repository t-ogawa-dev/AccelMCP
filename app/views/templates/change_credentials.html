{% extends "base.html" %}

{% block title %}資格情報の変更 - Accel MCP{% endblock %}

{% block content %}
<div class="page-header">
  <h2 data-i18n="change_credentials_title">管理者資格情報の変更</h2>
  {% if cred and not cred.is_initialized %}
  <div class="alert alert-warning" style="margin-top:1rem;" data-i18n="change_credentials_first_login_warning">
    初回ログインのため、資格情報を変更してください。すべての項目を入力してください。
  </div>
  {% endif %}
</div>

<div class="card" style="max-width:600px;">
  <div class="card-body">
    <div id="change-credentials-error" class="alert alert-danger" style="display:none;"></div>
    <div id="change-credentials-success" class="alert alert-success" style="display:none;"></div>

    <form id="change-credentials-form" novalidate>
      <h5 style="margin-bottom:1rem;" data-i18n="change_credentials_login_section">ログイン情報</h5>

      <div class="form-group" style="margin-bottom:1rem;">
        <label for="new-username" data-i18n="change_credentials_username">ユーザー名</label>
        <input type="text" id="new-username" name="username" class="form-control"
               value="{{ cred.username if cred else '' }}"
               data-i18n-placeholder="change_credentials_username_placeholder"
               placeholder="新しいユーザー名" autocomplete="off" maxlength="100">
      </div>

      <div class="form-group" style="margin-bottom:1rem;">
        <label for="new-password" data-i18n="change_credentials_new_password">新しいパスワード</label>
        <input type="password" id="new-password" name="password" class="form-control"
               data-i18n-placeholder="change_credentials_password_placeholder"
               placeholder="8文字以上" autocomplete="new-password">
      </div>

      <div class="form-group" style="margin-bottom:1.5rem;">
        <label for="confirm-password" data-i18n="change_credentials_confirm_password">パスワード（確認）</label>
        <input type="password" id="confirm-password" class="form-control"
               data-i18n-placeholder="change_credentials_confirm_placeholder"
               placeholder="パスワードを再入力" autocomplete="new-password">
      </div>

      <div class="form-actions" style="margin-top:1.5rem;">
        <button type="submit" class="btn btn-primary" id="save-btn" data-i18n="change_credentials_save">変更を保存</button>
        {% if cred and cred.is_initialized %}
        <a href="/dashboard" class="btn btn-secondary" style="margin-left:.5rem;" data-i18n="change_credentials_cancel">キャンセル</a>
        {% endif %}
      </div>
    </form>
  </div>
</div>

<script>
(async () => {
  // ログイン画面の localStorage 言語設定を DB に同期させる（初回ログイン時の引き継ぎ）
  // 同期後は localStorage から削除し、以降のリロードで上書きされないようにする
  const loginLang = localStorage.getItem('login_language');
  if (loginLang) {
    try {
      await fetch('/api/settings/language', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: loginLang })
      });
      localStorage.removeItem('login_language');
    } catch (_) {}
  }

  // 共通言語スイッチャーを初期化（ヘッダーに追加 + data-i18n 適用）
  await initLanguageSwitcher();

  // ページタイトルを翻訳
  document.title = t('change_credentials_page_title');

  // フォーム送信
  document.getElementById('change-credentials-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('new-username').value.trim();
    const password = document.getElementById('new-password').value;
    const confirmPw = document.getElementById('confirm-password').value;

    const errEl = document.getElementById('change-credentials-error');
    const okEl  = document.getElementById('change-credentials-success');
    errEl.style.display = 'none';
    okEl.style.display  = 'none';

    if (password && password !== confirmPw) {
      errEl.textContent = t('change_credentials_pw_mismatch');
      errEl.style.display = 'block';
      return;
    }
    if (password && password.length < 8) {
      errEl.textContent = t('change_credentials_pw_too_short');
      errEl.style.display = 'block';
      return;
    }

    const payload = {};
    if (username) payload.username = username;
    if (password) payload.password = password;

    if (Object.keys(payload).length === 0) {
      errEl.textContent = t('change_credentials_nothing_changed');
      errEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.textContent = t('change_credentials_saving');

    try {
      const resp = await fetch('/api/admin/credentials', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();

      if (resp.ok) {
        okEl.textContent = t('change_credentials_success');
        okEl.style.display = 'block';
        setTimeout(() => { window.location.href = '/dashboard'; }, 1200);
      } else {
        errEl.textContent = data.error || t('change_credentials_update_failed');
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = t('change_credentials_network_error');
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = t('change_credentials_save');
    }
  });
})();
</script>
{% endblock %}
