{% extends "base.html" %}

{% block title %}管理者アカウント新規登録 - Accel MCP{% endblock %}

{% block breadcrumb %}
<nav class="breadcrumb">
    <a href="/dashboard" data-i18n="breadcrumb_home">ホーム</a>
    <span class="breadcrumb-separator">›</span>
    <a href="/admin-users" data-i18n="breadcrumb_admin_user_list">管理者アカウント一覧</a>
    <span class="breadcrumb-separator">›</span>
    <span class="breadcrumb-current" data-i18n="breadcrumb_app_new">新規登録</span>
</nav>
{% endblock %}

{% block content %}
<div class="page-title">
    <h2 data-i18n="admin_user_new_title">管理者アカウント新規登録</h2>
    <p data-i18n="admin_user_new_desc">Web管理画面にログインできる新しい管理者アカウントを登録します</p>
</div>

<div class="form-card">
    <form id="admin-user-form">
        <div class="form-group">
            <label for="username"><span data-i18n="admin_user_username_label">ユーザー名</span> *</label>
            <input type="text" id="username" name="username" required maxlength="100" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password"><span data-i18n="admin_user_password_label">パスワード</span> *</label>
            <input type="password" id="password" name="password" required autocomplete="new-password">
            <small class="form-hint" data-i18n="admin_user_password_hint">8文字以上で入力してください</small>
        </div>

        <div class="form-group">
            <label for="confirm-password"><span data-i18n="admin_user_confirm_password_label">パスワード（確認）</span> *</label>
            <input type="password" id="confirm-password" name="confirm_password" required autocomplete="new-password">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" data-i18n="button_register">登録</button>
            <a href="/admin-users" class="btn btn-secondary" data-i18n="button_cancel">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/assets/view/admin_users/new.js"></script>
{% endblock %}
